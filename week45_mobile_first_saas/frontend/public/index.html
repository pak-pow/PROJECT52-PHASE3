<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PulseSub - Mobile-First SaaS Platform</title>
    <link rel="stylesheet" href="/css/base.css">
</head>
<body>
    <!-- Top Viewport Frame Simulator Control Bar -->
    <header class="simulator-top-bar">
        <div class="sim-brand">
            <span class="sim-pulse-dot"></span>
            <span class="sim-brand-text">PulseSub Device Simulator</span>
        </div>
        <div class="sim-controls">
            <label for="device-selector" class="sim-label">Viewport:</label>
            <select id="device-selector" class="sim-select-device">
                <option value="iphone15">iPhone 15 (393px)</option>
                <option value="pixel8">Pixel 8 (412px)</option>
                <option value="ipad">iPad Mini (768px)</option>
                <option value="responsive" selected>Fluid Responsive</option>
            </select>
        </div>
    </header>

    <!-- Outer Device Frame Wrapper -->
    <div id="device-frame-container" class="frame-responsive">
        <div id="app-root" class="app-layout">
            <!-- Top Application Bar -->
            <header class="app-header">
                <div class="header-brand">
                    <span class="brand-badge">PULSE</span>
                    <h1 class="brand-title">PulseSub</h1>
                </div>
                <div class="header-actions">
                    <div class="tier-pill" id="current-tier-pill">PRO PLAN</div>
                    <button id="theme-toggle-btn" class="icon-btn" aria-label="Toggle theme">
                        <span class="theme-icon">Theme</span>
                    </button>
                </div>
            </header>

            <!-- Dynamic View Container -->
            <main id="main-view-container" class="app-main">
                <div class="loading-spinner">Initializing PulseSub Platform...</div>
            </main>

            <!-- Bottom Navigation Bar for Mobile-First UX -->
            <nav class="bottom-nav" aria-label="Bottom navigation">
                <button class="nav-item active" data-tab="overview">
                    <span class="nav-icon-txt">O</span>
                    <span class="nav-label">Overview</span>
                </button>
                <button class="nav-item" data-tab="usage">
                    <span class="nav-icon-txt">U</span>
                    <span class="nav-label">Usage</span>
                </button>
                <button class="nav-item" data-tab="plans">
                    <span class="nav-icon-txt">P</span>
                    <span class="nav-label">Plans</span>
                </button>
                <button class="nav-item" data-tab="portal">
                    <span class="nav-icon-txt">B</span>
                    <span class="nav-label">Portal</span>
                </button>
                <button class="nav-item" data-tab="sandbox">
                    <span class="nav-icon-txt">S</span>
                    <span class="nav-label">Sandbox</span>
                </button>
            </nav>

            <!-- Bottom System Status Bar -->
            <footer class="system-status-bar">
                <span class="status-indicator"></span>
                <span id="status-meta-text">Connecting to backend...</span>
            </footer>
        </div>
    </div>

    <!-- Slide-Up Bottom Sheet Modal for Proration & Receipts -->
    <div id="bottom-modal" class="modal-overlay">
        <div id="modal-backdrop" class="modal-backdrop"></div>
        <div class="modal-sheet">
            <div class="modal-grabber"></div>
            <div class="modal-header">
                <h3 id="modal-title">Modal Title</h3>
                <button id="modal-close-btn" class="modal-close-btn" aria-label="Close modal">&times;</button>
            </div>
            <div id="modal-body" class="modal-body">
                Modal content...
            </div>
            <div class="modal-footer">
                <button id="modal-confirm-btn" class="action-btn primary full-width">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
