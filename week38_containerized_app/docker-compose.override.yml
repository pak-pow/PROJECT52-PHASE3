# Local Development Override Configuration
# Automatically merged with docker-compose.yml when running 'docker compose up' in development.
services:
  api:
    environment:
      FLASK_ENV: development
      DEBUG: "true"
    volumes:
      # The engine mounts the local backend directory into the container for instant hot-reloading
      - ./backend:/app
    ports:
      - "5000:5000"

  db:
    ports:
      - "5432:5432"

  cache:
    ports:
      - "6379:6379"
