services:
  # 1. Database Service: PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: docker-pulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-docker_pulse_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-docker_pulse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. Cache Service: Redis 7
  cache:
    image: redis:7-alpine
    container_name: docker-pulse-cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # 3. Application Service: Flask REST API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docker-pulse-api
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-docker_pulse_db}
      REDIS_URL: redis://cache:6379/0
      PORT: 5000
      HOST: 0.0.0.0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 4. Web Gateway Service: Nginx Reverse Proxy
  web:
    image: nginx:alpine
    container_name: docker-pulse-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    name: docker_pulse_postgres_data
  redis_data:
    name: docker_pulse_redis_data

networks:
  app-network:
    name: docker_pulse_network
    driver: bridge
