events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client payload caps (prevent payload and memory exhaustion attacks)
    client_max_body_size 1M;

    # Rate limiting zone for API protection (30 requests/sec with burst buffer)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    upstream flask_api {
        server api:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # Liveness probe for Nginx proxy
        location /healthz {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # Reverse proxy to Flask REST API with rate limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://flask_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # Static frontend assets (CSS and JavaScript modules)
        location /src/ {
            root /usr/share/nginx/html;
            access_log off;
            expires 1d;
        }

        # Static frontend UI files
        location / {
            root /usr/share/nginx/html/public;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
