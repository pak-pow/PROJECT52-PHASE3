name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "week37_ci_cd_pipeline/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "week37_ci_cd_pipeline/**"
      - ".github/workflows/ci.yml"

jobs:
  lint-and-format:
    name: Code Quality & Linting Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week37_ci_cd_pipeline/backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run Flake8 (PEP 8 Style Gate)
        run: python -m flake8 app tests

      - name: Run Black (Formatting Gate)
        run: python -m black --check app tests

      - name: Run isort (Import Ordering Gate)
        run: python -m isort --check-only app tests

  security-scan:
    name: Bandit Static Security Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week37_ci_cd_pipeline/backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Audit
        run: python -m bandit -r app -ll

  test-matrix:
    name: Test Matrix (Python ${{ matrix.python-version }})
    needs: [lint-and-format, security-scan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: week37_ci_cd_pipeline/backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov tomli

      - name: Run Pytest Suite with Coverage (90%+ Gate)
        run: |
          python -m pytest --cov=app --cov-report=xml --cov-report=term-missing tests/ -v

      - name: Upload Test Coverage Artifact
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py310
          path: week37_ci_cd_pipeline/backend/coverage.xml

  build-artifact:
    name: Build & Package Artifact
    needs: [test-matrix]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week37_ci_cd_pipeline/backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Packaging Tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Package Application Archive
        run: |
          mkdir -p dist
          tar -czf dist/app-release-bundle.tar.gz app/ run.py requirements.txt data/schema.sql

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: week37_ci_cd_pipeline/backend/dist/app-release-bundle.tar.gz
