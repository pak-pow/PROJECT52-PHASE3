name: Continuous Deployment (CD)

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "week37_ci_cd_pipeline/**"
      - ".github/workflows/cd.yml"

jobs:
  deploy-staging:
    name: Staging Deployment & Smoke Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week37_ci_cd_pipeline/backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "week37_ci_cd_pipeline/backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Start Staging Service
        env:
          FLASK_ENV: staging
          PORT: 5000
          APP_VERSION: "1.0.0-staging"
          GIT_COMMIT_HASH: ${{ github.sha }}
        run: |
          nohup python run.py > /tmp/staging.log 2>&1 &
          sleep 3
          cat /tmp/staging.log

      - name: Execute Post-Deploy Smoke Test Probe
        run: |
          python scripts/smoke_test.py --url http://127.0.0.1:5000

      - name: Record Staging Deployment Audit Log
        if: success()
        run: |
          curl -X POST http://127.0.0.1:5000/api/v1/deployments \
            -H "Content-Type: application/json" \
            -d '{
              "service_name": "deployment-monitor",
              "environment": "staging",
              "version": "1.0.0-staging",
              "commit_hash": "${{ github.sha }}",
              "triggered_by": "github-actions-cd",
              "status": "success",
              "notes": "Automated staging deployment passed smoke test probe"
            }'

  deploy-production:
    name: Production Release Gate
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: week37_ci_cd_pipeline/backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "week37_ci_cd_pipeline/backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Start Production Service
        env:
          FLASK_ENV: production
          PORT: 5000
          APP_VERSION: "1.0.0"
          GIT_COMMIT_HASH: ${{ github.sha }}
        run: |
          nohup python run.py > /tmp/prod.log 2>&1 &
          sleep 3
          cat /tmp/prod.log


      - name: Execute Production Health Probe
        run: |
          python scripts/smoke_test.py --url http://127.0.0.1:5000

      - name: Record Production Deployment Audit Log
        if: success()
        run: |
          curl -X POST http://127.0.0.1:5000/api/v1/deployments \
            -H "Content-Type: application/json" \
            -d '{
              "service_name": "deployment-monitor",
              "environment": "production",
              "version": "1.0.0",
              "commit_hash": "${{ github.sha }}",
              "triggered_by": "github-actions-cd",
              "status": "success",
              "notes": "Production release verified and live"
            }'
