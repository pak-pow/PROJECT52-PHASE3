<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PulseAuth - Consent Authorization</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      max-width: 440px;
      width: 100%;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.25rem;
      margin-top: 0;
      margin-bottom: 0.5rem;
      color: #38bdf8;
    }
    p {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .client-badge {
      display: inline-block;
      background: #0284c7;
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.75rem;
      margin-bottom: 1rem;
    }
    .scopes-list {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
    .scope-item {
      font-size: 0.875rem;
      color: #e2e8f0;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
    }
    .scope-item:last-child {
      margin-bottom: 0;
    }
    .scope-tag {
      font-family: monospace;
      background: #334155;
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
      margin-right: 0.5rem;
      color: #38bdf8;
      font-size: 0.8rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 0.375rem;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 0.625rem;
      border-radius: 6px;
      font-size: 0.875rem;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    button {
      flex: 1;
      padding: 0.75rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .btn-approve {
      background: #0284c7;
      color: white;
    }
    .btn-approve:hover {
      background: #0369a1;
    }
    .btn-deny {
      background: #334155;
      color: #94a3b8;
    }
    .btn-deny:hover {
      background: #475569;
      color: white;
    }
    .error-msg {
      background: #7f1d1d;
      border: 1px solid #ef4444;
      color: #fecaca;
      padding: 0.625rem;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="client-badge">{{ client.client_name }}</div>
    <h1>Authorize Application</h1>
    <p>This application is requesting permission to access your account for the following scopes:</p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <div class="scopes-list">
      {% for s in scopes %}
      <div class="scope-item"><span class="scope-tag">{{ s }}</span> Access granted for {{ s }}</div>
      {% endfor %}
    </div>

    <form method="POST" action="/oauth/authorize">
      <input type="hidden" name="client_id" value="{{ client.client_id }}">
      <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
      <input type="hidden" name="response_type" value="{{ response_type }}">
      <input type="hidden" name="scope" value="{{ scope }}">
      <input type="hidden" name="state" value="{{ state or '' }}">
      <input type="hidden" name="code_challenge" value="{{ code_challenge or '' }}">
      <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method or '' }}">
      <input type="hidden" name="nonce" value="{{ nonce or '' }}">

      <div class="form-group">
        <label for="email">Account Email</label>
        <input type="email" id="email" name="email" value="{{ email or 'developer@pulseauth.dev' }}" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter account password" required>
      </div>

      <div class="btn-group">
        <button type="submit" name="action" value="deny" class="btn-deny">Deny</button>
        <button type="submit" name="action" value="approve" class="btn-approve">Approve & Continue</button>
      </div>
    </form>
  </div>
</body>
</html>
